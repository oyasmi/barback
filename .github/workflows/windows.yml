name: Windows
on:
  push:
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows/global.json
      - run: ./scripts/build.ps1
      - run: ./scripts/test.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-evidence
          path: windows/TestResults/**
  package:
    strategy:
      matrix:
        architecture: [x64, arm64]
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows/global.json
      - run: ./scripts/package.ps1 -Architecture ${{ matrix.architecture }}
      - run: ./scripts/package-portable.ps1 -Architecture ${{ matrix.architecture }}
      - run: ./scripts/package-portable.ps1 -Architecture ${{ matrix.architecture }} -FrameworkDependent
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-msix-${{ matrix.architecture }}
          path: windows/dist/*.msix*
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.architecture }}
          path: windows/dist/*-portable*.zip
